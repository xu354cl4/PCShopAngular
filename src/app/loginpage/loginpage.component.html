@if(num == 1){
<div class="login-container">
  <div class="card">
    <h2 class="title">會員登入</h2>

    @if((errorMessage)){
    <div class="error-alert">
      <svg viewBox="64 64 896 896" focusable="false" data-icon="close-circle" width="1em" height="1em"
        fill="currentColor" aria-hidden="true" class="alert-icon">
        <path
          d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm165.4 618.2l-66-.3L512 563.4l-99.3 118.4-66.1.3c-4.4 0-8-3.5-8-8 0-1.9.7-3.7 1.9-5.2l130.1-155L340.5 359a8.32 8.32 0 01-1.9-5.2c0-4.4 3.6-8 8-8l66.1.3L512 464.6l99.3-118.4 66-.3c4.4 0 8 3.5 8 8 0 1.9-.7 3.7-1.9 5.2L553.5 514l130 155c1.2 1.5 1.9 3.3 1.9 5.2 0 4.4-3.6 8-8 8z">
        </path>
      </svg>

      <span class="alert-message">
        {{errorMessage}}
      </span>
    </div>

    }

    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="請輸入 Email" [(ngModel)]="dto.Mail" />
    </div>

    <div class="form-group">
      <label>密碼</label>
      <input type="password" placeholder="請輸入密碼" [(ngModel)]="dto.Password" />
    </div>

    <button class="login-btn" (click)="submit()">登入</button>
    <div class="links">
      <a routerLink="/forgot" (click)="goForgotpassword()">忘記密碼？</a>
      <a routerLink="/register" (click)="goRegister()">註冊帳號</a>
    </div>

    <div class="divider">
      <span>或使用第三方登入</span>
    </div>

    <!-- 🔽 第三方登入按鈕區塊 -->
    <div class="social-login">

      <button class="social-btn google" (click)="onGoogleLogin()">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" />
        Google 登入
      </button>

      <!-- 新的 Facebook 白底藍框
      <button class="social-btn facebook">
        <svg viewBox="0 0 24 24" width="20" height="20" style="fill:white;">
          <path
            d="M22 12.07C22 6.48 17.52 2 11.93 2S2 6.48 2 12.07c0 5.02 3.66 9.19 8.44 10v-7.07H7.9v-2.93h2.54V9.64c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.45h-1.26c-1.24 0-1.63.77-1.63 1.56v1.87h2.78l-.44 2.93h-2.34V22c4.78-.81 8.44-4.98 8.44-9.93z" />
        </svg>
        Facebook 登入
      </button>
        LINE
      <button class="social-btn line">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
          <path
            d="M12 2C6.48 2 2 5.94 2 10.76c0 3.03 1.92 5.7 4.79 7.2-.16.57-.58 2.04-.67 2.45-.1.43.15.42.31.31.13-.09 1.99-1.36 2.8-1.92.99.27 2.05.41 3.16.41 5.52 0 10-3.94 10-8.76S17.52 2 12 2zm4.6 10.41H15v1.75c0 .41-.34.75-.75.75s-.75-.34-.75-.75V8.84c0-.41.34-.75.75-.75h2.07c1.34 0 2.43 1.09 2.43 2.43s-1.09 2.43-2.43 2.43zM13 8.84c0-.41.34-.75.75-.75s.75.34.75.75v5.32c0 .41-.34.75-.75.75s-.75-.34-.75-.75V8.84zm-2.43 0c0-.41.34-.75.75-.75s.75.34.75.75v5.32c0 .41-.34.75-.75.75s-.75-.34-.75-.75V8.84zm-1.27 0h-.86v5.32c0 .41-.34.75-.75.75s-.75-.34-.75-.75V8.84H6.7c-.41 0-.75-.34-.75-.75s.34-.75.75-.75h1.6c.41 0 .75.34.75.75s-.34.75-.75.75z" />
        </svg>
        LINE 登入
      </button>  -->
      <div class="google-login-wrapper"
        style="min-height:40px;height: 40px; display:flex; justify-content: center;align-items: center;overflow: hidden;margin-top: 10px;">
        <app-google-login></app-google-login>
      </div>
    </div>
  </div>
</div>
}




@if(num == 4 ){

      <span class="arrow-4">▾</span>
    </label>

    <div class="submenu-4">
      <div class="submenu-item-4">優惠券</div>
      <div class="submenu-item-4">蝦幣紀錄</div>
      <div class="submenu-item-4">回饋活動</div>

    <!-- 大功能 5：登出 -->
    <div class="menu-header-4 logout-4">
      <span class="menu-icon-4">🚪</span>
      <span>登出</span>
    </div>

  </nav>
