<div class="shop-wrapper">

  <div class="shop-header">
    <h2 class="title">我的檔案</h2>
    <div class="subtitle">管理你的檔案以保護你的帳戶安全</div>
  </div>

  <div *ngIf="loading" class="alert-box loading">處理中...</div>

  <div *ngIf="!loading">

    <div *ngIf="error" class="alert-box error">{{ error }}</div>
    <div *ngIf="success" class="alert-box success">✓ {{ success }}</div>

    <form [formGroup]="profileForm" class="shop-form">

      <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px;">
        <input type="file" accept="image/*" (change)="onFileSelected($event)" />
        <button type="button" class="btn btn-outline-primary" (click)="uploadAvatar()" [disabled]="!selectedFile">
          上傳頭像
        </button>
        </div>

      <div style="margin-bottom: 20px;">
        <img *ngIf="previewUrl" [src]="previewUrl"
          style="width:80px; height:80px; border-radius:50%; object-fit:cover; border: 2px solid #ddd;" />
        <img *ngIf="!previewUrl" [src]="(avatarUrl$ | async) || '/assets/images/no-image.png'"
          style="width:80px; height:80px; border-radius:50%; object-fit:cover; border: 2px solid #ddd;" />
        </div>

        <div class="form-row">
        <label class="row-label">Email</label>
        <div class="row-content">
          <input type="email" class="shop-input" [(ngModel)]="emailInput" [readonly]="isThirdParty"
            [ngModelOptions]="{standalone: true}" />

          <div *ngIf="isThirdParty" class="hint-text">
            第三方登入帳號不可修改 Email
          </div>

          <div *ngIf="!isThirdParty && emailInput !== (authState.getCurrentUser()?.mail ?? '')" class="status-warn"
            style="color: #d97706; margin-top: 5px; font-size: 0.9em;">
            ⚠️ 按下儲存後，系統將寄送驗證信至新信箱，驗證後才會生效。
          </div>

          <div *ngIf="!isThirdParty && !isMailVerified && emailInput === (authState.getCurrentUser()?.mail ?? '')"
            class="status-warn" style="color: #dc2626; margin-top: 5px; font-size: 0.9em;">
            ⚠️ 此 Email 尚未驗證
            <button type="button" (click)="sendVerifyEmail()"
              style="margin-left:8px; text-decoration: underline; background:none; border:none; color: blue; cursor: pointer;">
              補寄驗證信
            </button>
          </div>
          </div>
      </div>

      <div class="form-row">
        <label class="row-label">姓名</label>
        <input class="shop-input" formControlName="fullName" />
        <div *ngIf="profileForm.get('fullName')?.invalid && profileForm.get('fullName')?.touched"
          style="color:red; font-size:12px;">
          請輸入姓名
        </div>
      </div>
<div class="form-row">
  <label class="row-label">生日</label>
        <input type="date" class="shop-input" formControlName="birthDate" />
        </div>

      <div class="form-row">
        <label class="row-label">手機</label>
        <input class="shop-input" formControlName="phone" />
        </div>

      <div class="form-footer" style="margin-top: 20px;">
        <button type="button" class="btn-shop primary" (click)="save()">
          儲存變更
        </button>
      </div>

    </form>
  </div>
</div>
