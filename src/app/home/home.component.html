<!-- Start Carousel -->
<div class="container">
  <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="/images/P1.png" class="d-block w-100" alt="Banner 1">
      </div>
      <div class="carousel-item">
        <img src="/images/P2.png" class="d-block w-100" alt="Banner 2">
      </div>
      <div class="carousel-item">
        <img src="/images/P4.jpg" class="d-block w-100" alt="Banner 3">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</div>
<!-- End Carousel -->

<!-- Start Banner Area -->
<section class="banner section mt-5">
  <div class="container">
    <div class="row">
      <div class="col-lg-6 col-md-6 col-12">
        <div class="single-banner" style="background-image:url('/images/banner1.png')">
          <div class="content">
            <h2>Smart Watch 2.0</h2>
            <p>Space Gray Aluminum Case with <br>Black/Volt Real Sport Band</p>
            <div class="button">
              <a href="#" class="btn btn-primary">View Details</a>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-6 col-md-6 col-12">
        <div class="single-banner" style="background-image:url('/images/banner2.png')">
          <div class="content">
            <h2>Smart Headphone</h2>
            <p>Lorem ipsum dolor sit amet, <br>eiusmod tempor incididunt ut labore.</p>
            <div class="button">
              <a href="#" class="btn btn-primary">Shop Now</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- End Banner Area -->

<!-- Start Hot Products -->
<section class="hot-products section mt-5">
  <div class="container">
    <div class="row">
      <div class="col-12 mb-4">
        <h2>Hot Products</h2>
      </div>

      <!-- Loading & Error -->
      <div class="col-12 mb-3 text-center" *ngIf="loading">
        載入中...
      </div>
      <div class="col-12 mb-3 text-center text-danger" *ngIf="error">
        {{ error }}
      </div>

      <!-- Hot Products Cards -->
      <div class="col-lg-4 col-md-6 col-12" *ngFor="let product of hotProducts">
        <div class="card mb-3" style="cursor: pointer;" (click)="goToProductDetail(product.id)">
          <img [src]="product.imageUrl" class="card-img-top" [alt]="product.name">
          <div class="card-body">
            <h5 class="card-title">{{ product.name }}</h5>
            <p class="card-text">${{ product.price }}</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
<!-- End Hot Products -->
