<div class="game-dialog-wrapper">
  <header class="game-header">
    {{ data.game | uppercase }}
  </header>

  <div class="game-body">
    <iframe [src]="safeUrl" class="game-iframe" tabindex="0"></iframe>
  </div>

  <footer class="game-footer">
    <button mat-button (click)="close()">關閉</button>
  </footer>
</div>
