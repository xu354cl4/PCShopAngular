<div class="page-wrapper">
  <div class="container-fluid mt-4">
    <div class="d-flex gap-4 flex-nowrap">

      <!-- 左側篩選欄 -->
      <div class="filter-sidebar sticky-top" style="min-width: 250px;">
        <app-product-filter (filterChange)="onFilterChange($event)"></app-product-filter>
      </div>

      <!-- 中間商品區 -->
      <div class="product-area flex-grow-1">

        <!-- 搜尋 / 排序 / 每頁筆數 區塊 -->
        <div class="d-flex flex-wrap align-items-center gap-3 mb-4">

          <!-- 搜尋欄 + 按鈕 -->
          <div class="d-flex flex-grow-1 gap-2 align-items-center min-w-0">
            <input class="form-control flex-grow-1" placeholder="搜尋產品..." [(ngModel)]="searchKeyword"
              (keyup.enter)="onSearchClick()" />
            <button class="btn btn-primary" style="white-space: nowrap;" (click)="onSearchClick()">搜尋</button>
          </div>

          <!-- 排序選單 -->
          <div class="d-flex" style="min-width: 180px;">
            <select class="form-control" [(ngModel)]="sortBy" (change)="triggerFetch()">
              <option value="name">依名稱排序</option>
              <option value="priceAsc">價格由低到高</option>
              <option value="priceDesc">價格由高到低</option>
            </select>
          </div>

          <!-- 每頁顯示筆數 -->
          <div class="d-flex" style="min-width: 150px;">
            <select class="form-control" [(ngModel)]="itemsPerPage" (change)="changeItemsPerPage()">
              <option *ngFor="let opt of itemsPerPageOptions" [ngValue]="opt">
                每頁 {{ opt }} 筆
              </option>
            </select>
          </div>

        </div>

        <!-- loading -->
        <div *ngIf="loading" class="text-center my-5">
          <div class="spinner-border text-primary" role="status"></div>
        </div>

        <!-- 商品列表 -->
        <div class="row g-3" *ngIf="!loading && pagedProducts.length">
          <div class="col-xl-3 col-lg-4 col-md-6 col-12"
            *ngFor="let product of pagedProducts; trackBy: trackByProductId">
            <div class="card h-100">

              <!-- 商品圖片 -->
              <a [routerLink]="['/products', product.id]">
                <img [src]="product.imageUrl || 'https://localhost:7001/images/products/noimage.jpg'"
                  class="card-img-top" [alt]="product.name" />
              </a>

              <!-- 卡片內容 -->
              <div class="card-body d-flex flex-column">

                <!-- 商品名稱與價格 -->
                <div class="flex-grow-1">
                  <h6 class="mb-1 text-truncate">
                    <a [routerLink]="['/products', product.id]" class="text-decoration-none text-dark">
                      {{ product.name }}
                    </a>
                  </h6>

                  <p class="mb-2">
                    <span *ngIf="product.salePrice" class="original-price text-decoration-line-through me-2">
                      $ {{ product.price | number:'1.0-0' }}
                    </span>
                    <span class="sale-price fw-bold">
                      $ {{ product.salePrice || product.price | number:'1.0-0' }}
                    </span>
                  </p>
                </div>

                <!-- ⭐ 固定星星 (Unicode) -->
                <div class="star-section mt-2" style="font-size: 1rem; color: #FFD700;">
                  ★★★★☆ <!-- 4 顆亮黃星 + 1 顆灰星 -->
                </div>

              </div>
            </div>
          </div>
        </div>

        <!-- 沒有資料 -->
        <div *ngIf="!loading && pagedProducts.length === 0" class="text-center my-5">
          <p>沒有符合條件的產品</p>
        </div>

        <!-- 分頁 -->
        <nav *ngIf="totalPages > 1" class="mt-4">
          <ul class="pagination justify-content-center">

            <li class="page-item" [class.disabled]="currentPage === 1">
              <button class="page-link" (click)="changePage(currentPage - 1)">上一頁</button>
            </li>

            <li class="page-item" *ngFor="let p of displayPages" [class.active]="p === currentPage">
              <button class="page-link" (click)="onClickPage(p)" [disabled]="p === '...'">{{ p }}</button>
            </li>

            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <button class="page-link" (click)="changePage(currentPage + 1)">下一頁</button>
            </li>

          </ul>
        </nav>

      </div>

      <!-- 右側空白欄位（可作廣告或其他展示用） -->
      <div class="filter-sidebar sticky-top" style="min-width: 250px;">
        <!-- 留空或放置廣告 -->
      </div>

    </div>
  </div>
</div>
<app-ad-slot positionCode="bottom"></app-ad-slot>
