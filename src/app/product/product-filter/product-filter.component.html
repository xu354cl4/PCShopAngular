<div class="filter-section mb-4">
  <h5>分類</h5>
  <ul class="list-group">
    <li *ngFor="let cat of availableCategories" class="list-group-item d-flex align-items-center">
      <input type="checkbox" class="form-check-input me-2" [checked]="isSelected(cat.name)"
        (change)="toggleCategory(cat.name)" />
      {{ cat.name }}
    </li>
  </ul>
  <button class="btn btn-sm btn-secondary mt-2" (click)="clear()">清除</button>
</div>

<div class="filter-section">
  <h5>價格篩選</h5>
  <div class="d-flex gap-2 align-items-center mb-2">
    <input type="number" class="form-control" placeholder="最低價" [(ngModel)]="minPrice" />
    <span>~</span>
    <input type="number" class="form-control" placeholder="最高價" [(ngModel)]="maxPrice" />
  </div>
  <button class="btn btn-sm btn-primary" (click)="applyPrice()">套用</button>
</div>
