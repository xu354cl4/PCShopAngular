<div class="filter-container p-3 border rounded">

  <!-- 價格篩選 -->
  <h6>價格篩選</h6>
  <div class="mb-3 d-flex flex-column gap-2">
    <input type="number" class="form-control" placeholder="最低價" [(ngModel)]="localMinPrice">
    <input type="number" class="form-control" placeholder="最高價" [(ngModel)]="localMaxPrice">
    <button class="btn btn-primary" (click)="applyPriceFilter()">套用</button>
  </div>

  <!-- 商品分類篩選 -->
  <h6>商品分類</h6>
  <div *ngFor="let c of categories" class="form-check">
    <input type="checkbox" class="form-check-input" [(ngModel)]="c.checked" (change)="onCategoryChange()" [id]="c.name">
    <label class="form-check-label" [for]="c.name">{{ c.name }}</label>
  </div>

  <!-- 清除篩選按鈕 -->
  <button class="btn btn-sm btn-secondary w-100 mt-3" (click)="resetFilter()">清除篩選</button>
</div>
