<div class="card p-3">

  <!-- 標題 -->
  <h5 class="mb-4">商品篩選</h5>

  <!-- ================= 價格範圍 ================= -->
  <div class="mb-4">
    <label class="form-label fw-semibold mb-2">
      價格範圍
    </label>

    <div class="d-flex flex-column gap-2">
      <input type="number" class="form-control" placeholder="最低價" [(ngModel)]="filter.minPrice"
        (input)="updatePrice()" />

      <input type="number" class="form-control" placeholder="最高價" [(ngModel)]="filter.maxPrice"
        (input)="updatePrice()" />
    </div>
  </div>

  <!-- ================= 商品分類 ================= -->
  <div class="mb-4">
    <label class="form-label fw-semibold mb-2">
      商品分類
    </label>

    <div class="d-flex flex-column gap-2">

      <div class="form-check" *ngFor="let c of categories">

        <input #chk type="checkbox" class="form-check-input" [checked]="filter.categories.includes(c)"
          (change)="toggleCategory(c, chk.checked)" />

        <label class="form-check-label ms-1">
          {{ c }}
        </label>

      </div>

    </div>
  </div>

  <!-- ================= 重設 ================= -->
  <button class="btn btn-outline-secondary w-100 mt-2" (click)="resetFilter()">
    重設篩選條件
  </button>

</div>
