<div class="page-wrapper">
  <div class="container mt-4">

    <div class="row">
      <!-- 商品圖片 -->
      <div class="col-md-6 mb-4">
        <div class="card h-100">
          <img [src]="product.imageUrl" class="card-img-top" [alt]="product.name" />
        </div>
      </div>

      <!-- 商品資訊 -->
      <div class="col-md-6 mb-4">
        <div class="card h-100 p-3">
          <h3>{{ product.name }}</h3>
          <p class="text-muted">{{ product.category }}</p>
          <p class="text-primary fw-bold">NT$ {{ product.price | number:'1.2-2' }}</p>

          <!-- 星星評價 -->
          <div class="text-warning mb-3">
            <ng-container *ngFor="let s of [].constructor(product.rating)">
              ★
            </ng-container>
            <ng-container *ngFor="let s of [].constructor(5 - product.rating)">
              ☆
            </ng-container>
          </div>

          <p class="description">{{ product.description }}</p>

          <!-- 庫存 -->
          <p class="text-muted">庫存剩餘: {{ product.stock }}</p>

          <!-- 數量選擇 & 加入購物車 -->
          <div class="d-flex gap-2 align-items-center mt-3">
            <input type="number" class="form-control" style="width:80px;" [(ngModel)]="quantity" min="1"
              [max]="product.stock || 1">
            <button class="btn btn-primary" (click)="addToCart()">加入購物車</button>
          </div>

        </div>
      </div>
    </div>

    <!-- 可選：相關商品 / 推薦商品 -->

    -->

  </div>
</div>
