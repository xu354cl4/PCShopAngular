<div class="page-wrapper" *ngIf="!loading && product; else loadingTpl">
  <div class="container mt-4">

    <div class="row">
      <!-- 商品圖片 -->
      <div class="col-md-6 mb-4">
        <img [src]="product.images[0] || 'assets/no-image.png'" class="img-fluid product-image" [alt]="product.name">
      </div>

      <!-- 商品資訊 -->
      <div class="col-md-6 mb-4">
        <h3>{{ product.name }}</h3>
        <p class="text-muted">{{ product.category }}</p>

        <p class="text-primary fw-bold">
          NT$ {{ product.price | number:'1.0-0' }}
        </p>

        <!-- 星星評價 -->
        <div class="text-warning mb-2">
          <ng-container *ngFor="let _ of [].constructor(product.rating)">★</ng-container>
          <ng-container *ngFor="let _ of [].constructor(5 - product.rating)">☆</ng-container>
        </div>

        <p class="description">{{ product.description }}</p>
        <p class="text-muted">保固：{{ product.warrantyInfo }}</p>
      </div>
    </div>

  </div>
</div>

<ng-template #loadingTpl>
  <p class="text-center mt-5">載入中...</p>
</ng-template>
