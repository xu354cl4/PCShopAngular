<div class="page-wrapper" *ngIf="!loading && product; else loadingTpl">
  <div class="container mt-4">

    <div class="row">
      <!-- 商品圖片 -->
      <div class="col-md-6 mb-4">
        <img
          [src]="(product.images && product.images.length > 0 ? product.images[0] : 'https://localhost:7001/images/products/noimage.jpg')"
          class="img-fluid product-image" [alt]="product.name">
      </div>

      <!-- 商品資訊 -->
      <div class="col-md-6 mb-4">
        <h3>{{ product.name }}</h3>
        <p class="text-muted">{{ product.category }}</p>

        <!-- 商品價格 -->
        <div class="price-wrapper mb-2">
          <!-- 原價：只有在有折扣時顯示 -->
          <span class="original-price" *ngIf="selectedSku && selectedSku.priceAdjustment != 0">
            NT$ {{ product.price | number:'1.0-0' }}
          </span>

          <!-- 折扣後價格 -->
          <span class="sale-price">
            NT$ {{ (selectedSku ? getSkuPrice(selectedSku) : product.price) | number:'1.0-0' }}
          </span>
        </div>

        <!-- 星星評價 -->
        <div class="text-warning mb-2">
          <ng-container *ngFor="let _ of [].constructor(product.rating)">★</ng-container>
          <ng-container *ngFor="let _ of [].constructor(5 - product.rating)">☆</ng-container>
        </div>

        <p class="description">{{ product.description }}</p>
        <p class="text-muted">保固：{{ product.warrantyInfo }}</p>

        <!-- SKU 選擇 -->
        <div *ngIf="!loadingSkus && skus.length">
          <h5>選擇規格：</h5>
          <div class="sku-list">
            <button *ngFor="let sku of skus" class="btn me-2 mb-2"
              [ngClass]="{'btn-secondary': sku !== selectedSku, 'btn-primary': sku === selectedSku, 'disabled': isOutOfStock(sku)}"
              (click)="selectSku(sku)" [disabled]="isOutOfStock(sku)">
              {{ sku.skuname }}
              <span *ngIf="isOutOfStock(sku)" class="text-danger">(缺貨)</span>
            </button>
          </div>
        </div>

        <!-- 庫存與數量提示 -->
        <div *ngIf="selectedSku" class="mt-2">
          <p [ngClass]="{'text-danger': quantityExceeded, 'text-success': !quantityExceeded}">
            庫存: {{ selectedSku.stockQuantity }}
            <span *ngIf="quantityExceeded">- 已超過庫存!</span>
          </p>
          <p *ngIf="isOutOfStock(selectedSku)" class="text-danger">
            此規格已缺貨
          </p>
        </div>

        <!-- 選擇數量 -->
        <div class="mt-2">
          <label>數量：</label>
          <input type="number" class="form-control w-25" [(ngModel)]="quantity" (ngModelChange)="onQuantityChange()"
            min="1">
        </div>

        <!-- 加入購物車按鈕 -->
        <div class="mt-3">
          <button class="btn btn-success" [disabled]="!selectedSku || isOutOfStock(selectedSku)" (click)="addToCart()">
            加入購物車
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<ng-template #loadingTpl>
  <p class="text-center mt-5">載入中...</p>
</ng-template>
