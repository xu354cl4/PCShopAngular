<header class="header navbar-area">
  <!-- Start Topbar -->
  <div class="topbar">
    <div class="container">
      <div class="row align-items-center">

        <!-- 左側（保留空白即可） -->
        <div class="col-lg-6 col-md-6 col-6">
          <div class="top-left"></div>
        </div>

        <!-- 右側（會員登入 / 訪客） -->
        <div class="col-lg-6 col-md-6 col-6">
          <div class="top-end d-flex justify-content-end">
            <ul class="user-login d-flex align-items-center">

              <!-- 已登入 -->
              <li class="user-box d-flex align-items-center" *ngIf="user$ | async as user">
                <img class="avatar" [src]="(avatarUrl$ | async) || '/images/no-image.png'" alt="avatar" />

                <span class="username">{{ user.fullName }}</span>

                <a routerLink="/membercenter" class="link">會員中心</a>

                <button class="btn-logout" (click)="logout()">登出</button>
              </li>

              <!-- 未登入 -->
              <li class="guest-box d-flex align-items-center" *ngIf="!(user$ | async)">
                <i class="lni lni-user"></i>
                訪客
                <a routerLink="/loginpage" class="link">登入</a>
                <a routerLink="/register" class="link" (click)="goRegister()">註冊</a>
              </li>

            </ul>
          </div>
        </div>

      </div>
    </div>
  </div>
  <!-- End Topbar -->

  <!-- Start Header Middle -->
  <div class="header-middle">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-lg-3 col-md-3 col-7">
          <!-- Start Header Logo -->
          <a class="navbar-brand" routerLink="home">
            <img src="assets/images/logo/logo.svg" alt="Logo">
          </a>
          <!-- End Header Logo -->
        </div>
        <div class="col-lg-4 col-md-2 col-5">
          <div class="middle-right-area d-flex align-items-center justify-content-end">
            <div class="navbar-cart d-flex align-items-center">
              <div class="wishlist">
                <a href="javascript:void(0)">
                  <i class="lni lni-heart"></i>
                  <span class="total-items">0</span>
                </a>
              </div>
              <div class="cart-items">
                <a href="javascript:void(0)" class="main-btn">
                  <i class="lni lni-cart"></i>
                  <span class="total-items">2</span>
                </a>
                <!-- Shopping Item -->
                <div class="shopping-item">
                  <div class="dropdown-cart-header">
                    <span>2 Items</span>
                    <a href="#">View Cart</a>
                  </div>
                  <ul class="shopping-list">
                    <li>
                      <a href="javascript:void(0)" class="remove" title="Remove this item"><i
                          class="lni lni-close"></i></a>
                      <div class="cart-img-head">
                        <a class="cart-img" href="#"><img src="assets/images/header/cart-items/item1.jpg" alt="#"></a>
                      </div>
                      <div class="content">
                        <h4><a href="#">Apple Watch Series 6</a></h4>
                        <p class="quantity">1x - <span class="amount">$99.00</span></p>
                      </div>
                    </li>
                    <li>
                      <a href="javascript:void(0)" class="remove" title="Remove this item"><i
                          class="lni lni-close"></i></a>
                      <div class="cart-img-head">
                        <a class="cart-img" href="#"><img src="assets/images/header/cart-items/item2.jpg" alt="#"></a>
                      </div>
                      <div class="content">
                        <h4><a href="#">Wi-Fi Smart Camera</a></h4>
                        <p class="quantity">1x - <span class="amount">$35.00</span></p>
                      </div>
                    </li>
                  </ul>
                  <div class="bottom">
                    <div class="total">
                      <span>Total</span>
                      <span class="total-amount">$134.00</span>
                    </div>
                    <div class="button">
                      <a routerLink="/cart" class="btn animate">Checkout</a>
                    </div>
                  </div>
                </div>
                <!--/ End Shopping Item -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- End Header Middle -->

  <!-- Start Header Bottom -->
  <div class="header-bottom">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-lg-12">
          <div class="nav-inner d-flex align-items-center">
            <!-- ===== 分類（Mega Menu）===== -->
            <div class="mega-category-menu me-4">
              <button class="cat-button">
                <i class="lni lni-menu"></i> 分類
              </button>
              <ul class="sub-category">
                <li *ngFor="let cat of categories">
                  <button class="dropdown-item" (click)="goToCategory(cat.name)">
                    {{ cat.name }}
                  </button>
                </li>
              </ul>
            </div>

            <!-- ===== 主 Navbar ===== -->
            <nav class="navbar navbar-expand-lg p-0 flex-grow-1">
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="toggler-icon"></span>
                <span class="toggler-icon"></span>
                <span class="toggler-icon"></span>
              </button>

              <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                  <li class="nav-item">
                    <a routerLink="/home" class="nav-link">首頁</a>
                  </li>
                  <li class="nav-item">
                    <a routerLink="/products" class="nav-link">商城</a>
                  </li>
                  <li class="nav-item">
                    <a routerLink="/faqs" class="nav-link">問題專區</a>
                  </li>
                  <li class="nav-item">
                    <a routerLink="/order-list" class="nav-link">訂單</a>
                  </li>
                  <li class="nav-item">
                    <a routerLink="/cart" class="nav-link">購物車</a>
                  </li>
                  <li class="nav-item">
                    <a routerLink="/adsback" class="nav-link">廣告管理(之後塞後台)</a>
                  </li>
                  <li class="nav-item">
                    <a routerLink="/faqsback" class="nav-link">問題管理(之後塞後台)</a>
                  </li>
                </ul>
              </div>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- End Header Bottom -->
</header>
