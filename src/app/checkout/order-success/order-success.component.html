<div class="success-container">
    <div class="success-card">
        <!-- Waiting State -->
        <ng-container *ngIf="status === 'waiting'">
            <div class="status-wrapper">
                <i class="pi pi-spin pi-spinner" style="font-size: 5rem; color: #f39c12;"></i>
            </div>
            <h1>等待付款中...</h1>
            <p class="order-id">訂單編號: <span>{{orderId}}</span></p>
            <p class="message">訂單已成功建立！請點擊右下角按鈕完成付款內容。</p>
        </ng-container>

        <!-- Success State -->
        <ng-container *ngIf="status === 'success'">
            <div class="status-wrapper">
                <div class="checkmark-circle">
                    <div class="checkmark draw"></div>
                </div>
            </div>
            <h1>付款成功！</h1>
            <p class="order-id">訂單編號: <span>{{orderId}}</span></p>
            <p class="message">感謝您的購買！我們已收到您的款項，訂單將盡快為您處理。</p>
        </ng-container>

        <!-- Failure State -->
        <ng-container *ngIf="status === 'failure'">
            <div class="status-wrapper">
                <div class="failure-circle">
                    <i class="pi pi-times" style="font-size: 3rem; color: #e74c3c;"></i>
                </div>
            </div>
            <h1>付款失敗</h1>
            <p class="order-id">訂單編號: <span>{{orderId}}</span></p>
            <p class="message">很抱歉，處理您的付款時發生錯誤。請確認付款資訊或聯繫客服。</p>
        </ng-container>

        <div class="actions">
            <!-- 繼續購物：僅在非等待付款狀態顯示 -->
            <button pButton label="繼續購物" icon="pi pi-shopping-bag" routerLink="/products"
                class="p-button-raised p-button-primary" *ngIf="status !== 'waiting'"></button>

            <!-- 查看訂單：一律顯示 -->
            <button pButton label="查看訂單" icon="pi pi-list" routerLink="/order-list" class="p-button-outlined"></button>

            <!-- 去付款：僅等待付款狀態顯示，並使用顏色更突出的樣式 -->
            <button pButton label="去付款" icon="pi pi-credit-card" (click)="onPay()"
                class="p-button-raised p-button-danger pay-now-btn" *ngIf="status === 'waiting'"></button>
        </div>

    </div>
</div>
