<div class="auth-wrapper">
  <div class="auth-card">
    <h2>帳號驗證</h2>
    <p class="subtitle">
      請依照指示完成帳號驗證流程
    </p>

    <!-- Forgot Password / Send Mail -->
    @if (mode === 'request') {
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          placeholder="請輸入註冊 Email"
          [(ngModel)]="mail"
        />
      </div>

      <button
        class="primary-btn"
        (click)="sendResetMail()"
        [disabled]="loading"
      >
        {{ loading ? '寄送中...' : '寄送驗證信' }}
      </button>
    }

    <!-- Reset Password -->
    @if (mode === 'reset') {
      <div class="form-group">
        <label>新密碼</label>
        <input
          type="password"
          placeholder="至少 8 碼"
          [(ngModel)]="newPassword"
        />
      </div>

      <div class="form-group">
        <label>確認密碼</label>
        <input
          type="password"
          placeholder="再次輸入密碼"
          [(ngModel)]="confirmPassword"
        />
      </div>

      <button class="primary-btn" (click)="resetPassword()">
        重設密碼
      </button>
    }

    <!-- Verify Email -->
    @if (mode === 'verify') {
      <div class="loading-box">
        <div class="spinner"></div>
        <p>信箱驗證中，請稍候…</p>
      </div>
    }

    <!-- Success / Error -->
    @if (message) {
      <div class="alert success">
        {{ message }}
      </div>
    }

    @if (errorMessage) {
      <div class="alert error">
        {{ errorMessage }}
      </div>
    }

    <a routerLink="/login" class="back-link" *ngIf="message">
      回登入頁
    </a>
  </div>
</div>
